server {
    listen 8080 default_server;
    server_name _;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location = /_nginx_health {
        access_log off;
        return 204;
    }

    location / {
        return 503;
    }
}
